name: validate

on: [push, pull_request]

jobs:
  generated-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: make tools
      - run: make generate
      - run: make verify
